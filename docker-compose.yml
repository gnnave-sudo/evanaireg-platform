services:
  evan-aireg:
    build: .
    ports:
      - "8100:8100"
    env_file:
      - .env
    volumes:
      - ./evanaireg.db:/app/evanaireg.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
